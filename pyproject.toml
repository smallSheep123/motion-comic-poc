[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-comic-engine"
version = "0.4.0"
description = "Vision-directed motion comic engine: director.json -> timeline compiler -> programmatic renderer (PIL + ffmpeg)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
motion-comic = "motion_comic.cli:main"

[tool.setuptools.packages.find]
include = ["motion_comic*"]
