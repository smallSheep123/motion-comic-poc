<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>时间轴对齐编辑器</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Microsoft YaHei", sans-serif; background: #1b1b1f; color: #ddd; display: flex; height: 100vh; overflow: hidden; }
  #side { width: 110px; background: #232329; overflow-y: auto; padding: 6px; flex-shrink: 0; }
  #side img { width: 100%; margin-bottom: 6px; border: 2px solid transparent; cursor: pointer; display: block; }
  #side img.cur { border-color: #4f9cf9; }
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #bar { padding: 8px 12px; background: #26262c; display: flex; gap: 10px; align-items: center; }
  button { background: #3a3a44; color: #ddd; border: 1px solid #555; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #4a4a56; }
  button.primary { background: #2d6ecf; border-color: #2d6ecf; }
  #status { margin-left: auto; color: #9a9; font-size: 13px; }
  #stage { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; gap: 16px; align-items: flex-start; }
  #fig { position: relative; width: 30%; flex-shrink: 0; }
  #fig img { width: 100%; display: block; cursor: pointer; }
  #fig svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #fig rect { fill: rgba(79,156,249,0.06); stroke: #4f9cf9; stroke-width: 1.5; cursor: pointer; }
  #fig rect.on { stroke: #ffb340; fill: rgba(255,179,64,0.15); stroke-width: 3; }
  #right { flex: 1; min-width: 0; padding-top: 8px; position: relative; }
  #pv { position: absolute; inset: 0; display: none; z-index: 3; }
  #wave { width: 100%; height: 100px; display: block; background: #101014; border-radius: 4px; }
  #track { position: relative; height: 116px; margin-top: 6px; }
  .blk { position: absolute; top: 0; height: 100%; border: 1px solid #666; border-radius: 5px; background: #26262e; overflow: hidden; }
  .blk .thumb { position: absolute; left: 4px; top: 4px; width: 52px; height: 70px; border-radius: 3px; pointer-events: none; background: #111; overflow: hidden; }
  .blk .info { position: absolute; left: 62px; right: 6px; top: 4px; pointer-events: none; }
  .blk .dur { font-size: 15px; color: #ffd479; font-weight: bold; }
  .blk .txt { font-size: 12px; color: #bbb; line-height: 1.3; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .blk.sel { border-color: #ffb340; background: #2c2c38; }
  .gapz { position: absolute; top: 0; height: 100%; background: repeating-linear-gradient(45deg, #1c2027, #1c2027 6px, #232833 6px, #232833 12px); border: 1px dashed #4a5568; }
  .hdl { position: absolute; width: 10px; height: 108px; background: #ffb340; border-radius: 2px; cursor: ew-resize; z-index: 6; }
  .hdl.gaph { background: #7f8ea3; cursor: col-resize; }
  .hdl.endh { background: #7f8ea3; }
  .hdl.sel { outline: 2px solid #ff5252; }
  #tip { position: fixed; display: none; background: #ffd479; color: #222; font-weight: bold; font-size: 13px; padding: 4px 10px; border-radius: 4px; pointer-events: none; z-index: 50; }
  #hint { padding: 4px 12px; background: #202024; color: #888; font-size: 12px; }
</style>
</head>
<body>
<div id="side"></div>
<div id="main">
  <div id="bar">
    <button class="primary" onclick="savePage()">保存本页（写回音频）</button>
    <button onclick="togglePv()" id="pvbtn">▶ 预览本页（图随声动）</button>
    <button onclick="playSel()">▶ 试听选中格台词</button>
    <span id="status"></span>
  </div>
  <div id="stage">
    <div id="fig"><img id="img"><div id="pv"></div><svg id="ov"></svg></div>
    <div id="right">
      <canvas id="wave" height="100"></canvas>
      <div id="track"></div>
      <div id="cursor" style="position:absolute;display:none;width:2px;background:#ff5252;z-index:9"></div>
    </div>
  </div>
  <div id="hint">橙柄=句子切分（两格语音的分界） | 灰柄=格间空隙/结尾停留（斜纹区，可留给转场） | 点击方框或块=选中并试听 | 方向键微调</div>
</div>
<div id="tip"></div>
<script>
const S = { pages: [], cur: -1, blocks: [], cuts: [], gaps: [], endPad: 0, block: null, sr: 0, sel: -1, hdl: null, ctx: null, px: 1 };
const $ = id => document.getElementById(id);
window.onerror = (m, src, l) => { const s = document.getElementById("status"); if (s) s.textContent = "错误: " + m + " (行" + l + ")"; };
async function api(p, body) {
  const o = body ? { method: "POST", headers: {"Content-Type": "application/json"}, body } : {};
  return (await fetch(p, o)).json();
}
function ctx() {
  if (!S.ctx) S.ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (S.ctx.state === "suspended") S.ctx.resume();
  return S.ctx;
}
function status(t) { $("status").textContent = t; }
const n = () => S.blocks.length;
// 语音段时长（由切分点解出）
const spk = k => (k === 0 ? S.cuts[0] : k === n() - 1 ? S.blockDur - S.cuts[n() - 2] : S.cuts[k] - S.cuts[k - 1]);
const gap = k => (k < n() - 1 ? S.gaps[k] : S.endPad);            // 该格之后的留空
const dispStart = k => { let t = 0; for (let i = 0; i < k; i++) t += spk(i) + gap(i); return t; };
const dispWidth = k => spk(k) + gap(k);
const total = () => { let t = 0; for (let k = 0; k < n(); k++) t += dispWidth(k); return t; };

async function init() {
  const d = await api("/api/data");
  const byPage = new Map();
  for (const s of d.shots) {
    if (!byPage.has(s.page)) byPage.set(s.page, []);
    byPage.get(s.page).push(s);
  }
  S.pages = [...byPage.entries()].map(([page, shots]) => ({ page, shots }));
  const side = $("side");
  S.pages.forEach((p, i) => {
    const im = document.createElement("img");
    im.src = "/image/" + p.page; im.title = p.page;
    im.onclick = () => loadPage(i);
    side.appendChild(im);
  });
  loadPage(0);
}

async function loadPage(i) {
  S.cur = i; S.sel = -1; S.hdl = null;
  const p = S.pages[i];
  $("img").src = "/image/" + p.page;
  document.querySelectorAll("#side img").forEach((im, k) => im.classList.toggle("cur", k === i));
  ctx();
  const bufs = []; let t = 0;
  for (const sh of p.shots) {
    const ab = await (await fetch("/audio?p=" + encodeURIComponent(sh.audio))).arrayBuffer();
    const buf = await S.ctx.decodeAudioData(ab);
    bufs.push(buf); t += buf.duration;
  }
  S.sr = bufs[0].sampleRate;
  S.block = new Float32Array(Math.round(t * S.sr));
  let off = 0;
  for (const b of bufs) { S.block.set(b.getChannelData(0), off); off += b.length; }
  S.blockDur = t;
  S.blocks = p.shots.map((sh, k) => ({ shot: sh, text: sh.text, bbox: sh.bbox }));
  // 当前切片点 = 各段时长的累加（AI 静音切分的既有结果），空隙默认 0
  S.cuts = []; let acc = 0;
  for (let k = 0; k < S.blocks.length - 1; k++) { acc += bufs[k].duration; S.cuts.push(acc); }
  S.gaps = S.blocks.map(() => 0);
  S.endPad = 0;
  await new Promise(r => { const im = $("img"); if (im.complete && im.naturalWidth) r(); else im.onload = r; });
  draw();
  status(`${p.page} · ${p.shots.length} 格 · 语音 ${t.toFixed(1)}s`);
}

function draw() {
  const W = $("right").clientWidth, H = 100;
  const cv = $("wave"); cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.fillStyle = "#101014"; g.fillRect(0, 0, W, H);
  const T = Math.max(total(), 1);
  S.px = W / T;
  const data = S.block, step = Math.max(1, Math.floor(data.length / W));
  g.strokeStyle = "#5aa9ff";
  for (let x = 0; x < W; x++) {
    let lo = 1, hi = -1;
    const a = Math.round(x * step), b = Math.min(a + step, data.length);
    for (let k = a; k < b; k += 4) { const v = data[k]; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (hi < lo) continue;
    g.beginPath();
    g.moveTo(x + 0.5, H / 2 - hi * H / 2 * 0.92); g.lineTo(x + 0.5, H / 2 - lo * H / 2 * 0.92);
    g.stroke();
  }
  const track = $("track"); track.innerHTML = ""; track.style.width = W + "px";
  const page = S.pages[S.cur].page;
  S.blocks.forEach((bl, k) => {
    const x0 = dispStart(k) * S.px, sw = spk(k) * S.px, gw = gap(k) * S.px;
    const visG = Math.max(gw, k < n() - 1 ? 10 : (S.endPad > 0 ? gw : 0) || 0);
    const d = document.createElement("div");
    d.className = "blk" + (k === S.sel ? " sel" : "");
    d.style.left = x0 + "px"; d.style.width = Math.max(sw, 12) + "px";
    d.onclick = () => selectBlk(k);
    // 格子缩略图（contain 裁切，居中，不串格；尺寸取自图片真实分辨率）
    const bb = bl.bbox, IMG = $("img");
    const PW = IMG.naturalWidth || 1810, PH = IMG.naturalHeight || 2560;
    if (bb) {
      const pw = (bb[2] - bb[0]) * PW, ph = (bb[3] - bb[1]) * PH;
      const scale = Math.min(52 / pw, 70 / ph);
      const iw = PW * scale, ih = PH * scale;
      const th = document.createElement("div");
      th.className = "thumb";
      th.innerHTML = `<div style="position:absolute;left:50%;top:50%;width:${iw}px;height:${ih}px;transform:translate(-50%,-50%);overflow:hidden">` +
        `<img src="/image/${page}" style="position:absolute;width:${iw}px;left:${-bb[0] * iw}px;top:${-bb[1] * ih}px"></div>`;
      d.appendChild(th);
    }
    const info = document.createElement("div");
    info.className = "info";
    info.style.left = (bb ? 62 : 6) + "px";
    info.innerHTML = `<div class="dur">${dispWidth(k).toFixed(1)}s</div><div class="txt">#${k + 1} ${bl.text}</div>`;
    d.appendChild(info);
    track.appendChild(d);
    // 格间空隙区（斜纹）
    const showGap = k < n() - 1 ? true : S.endPad > 0.02;
    if (showGap) {
      const gz = document.createElement("div");
      gz.className = "gapz";
      gz.style.left = (x0 + sw) + "px"; gz.style.width = Math.max(visG - 2, 6) + "px";
      if (gap(k) <= 0.02) gz.style.opacity = 0.3;
      track.appendChild(gz);
    }
  });
  // 橙柄：句子切分
  S.cuts.forEach((c, k) => {
    const x = (dispStart(k) + spk(k)) * S.px;
    track.appendChild(mkHandle("hdl", x, { type: "cut", k }, S.hdl === `cut${k}`));
  });
  // 灰柄：格间空隙
  for (let k = 0; k < n() - 1; k++) {
    const x = (dispStart(k) + spk(k) + S.gaps[k] / 2) * S.px;
    track.appendChild(mkHandle("hdl gaph", x, { type: "gap", k }, S.hdl === `gap${k}`));
  }
  // 灰柄：结尾停留
  if (n() > 0) {
    const x = (dispStart(n() - 1) + spk(n() - 1) + S.endPad / 2) * S.px;
    track.appendChild(mkHandle("hdl endh", x, { type: "end", k: n() - 1 }, S.hdl === "end"));
  }
  drawOverlay();
}

function mkHandle(cls, x, ref, selected) {
  const h = document.createElement("div");
  h.className = cls + (selected ? " sel" : "");
  h.style.left = (x - 5) + "px";
  h.onmousedown = e => { e.preventDefault(); e.stopPropagation(); S.hdl = ref.type + ref.k; draw(); startDrag(e, ref); };
  return h;
}

function drawOverlay() {
  const fig = $("fig"), ov = $("ov");
  const r = fig.getBoundingClientRect();
  ov.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
  ov.innerHTML = "";
  const img = $("img");
  S.blocks.forEach((bl, k) => {
    if (!bl.bbox) return;
    const [x0, y0, x1, y1] = bl.bbox;
    const rc = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rc.setAttribute("x", x0 * img.clientWidth); rc.setAttribute("y", y0 * img.clientHeight);
    rc.setAttribute("width", (x1 - x0) * img.clientWidth); rc.setAttribute("height", (y1 - y0) * img.clientHeight);
    if (k === S.sel) rc.classList.add("on");
    rc.onclick = () => selectBlk(k);
    ov.appendChild(rc);
  });
}

function selectBlk(k) {
  S.sel = k; draw();
  play(k);
  status(`格 ${k + 1}（${S.blocks[k].shot.id}）· 持续 ${dispWidth(k).toFixed(2)}s · ${S.blocks[k].text.slice(0, 16)}…`);
}

function play(k) {
  const c = ctx();
  const src = c.createBufferSource();
  src.buffer = pageBuffer();
  src.connect(c.destination);
  src.start(0, dispStart(k), spk(k));  // 只播台词，不含留空
}
function playSel() { if (S.sel >= 0) play(S.sel); }
function pageBuffer() {
  const c = ctx();
  const buf = c.createBuffer(1, S.block.length, S.sr);
  buf.copyToChannel(S.block, 0);
  return buf;
}

// —— 页内预览：按显示时间轴播放，图片随留空与台词切换 ——
const PV = { on: false, t0: 0, raf: 0, srcs: [], lastK: -1 };
function togglePv() { PV.on ? pvStop() : pvStart(); }
function pvStart() {
  const c = ctx();
  PV.srcs.forEach(s => { try { s.stop(); } catch (e) {} }); PV.srcs = [];
  PV.t0 = c.currentTime + 0.2;
  for (let k = 0; k < n(); k++) {
    const src = c.createBufferSource();
    src.buffer = pageBuffer(); src.connect(c.destination);
    src.start(PV.t0 + dispStart(k), dispStart(k), spk(k));
    PV.srcs.push(src);
  }
  PV.on = true; PV.lastK = -1;
  $("pvbtn").textContent = "■ 停止预览";
  $("pv").style.display = "block"; $("cursor").style.display = "block";
  $("cursor").style.height = ($("wave").clientHeight + 6 + $("track").clientHeight) + "px";
  pvTick();
}
function pvStop() {
  PV.srcs.forEach(s => { try { s.stop(); } catch (e) {} });
  PV.on = false; cancelAnimationFrame(PV.raf);
  $("pvbtn").textContent = "▶ 预览本页（图随声动）";
  $("pv").style.display = "none"; $("cursor").style.display = "none";
}
function pvTick() {
  if (!PV.on) return;
  const tt = S.ctx.currentTime - PV.t0;
  if (tt > total()) { pvStop(); return; }
  $("cursor").style.left = (tt * S.px) + "px";
  let k = 0;
  for (let j = 0; j < n(); j++) if (tt >= dispStart(j)) k = j;
  if (k !== PV.lastK) {
    PV.lastK = k;
    const bl = S.blocks[k], b = bl.bbox;
    const IMG = $("img");
    const PW = IMG.naturalWidth || 1810, PH = IMG.naturalHeight || 2560;
    const fig = $("fig"), fw = fig.clientWidth, fh = fig.clientHeight;
    if (b) {
      const pw = (b[2] - b[0]) * PW, ph = (b[3] - b[1]) * PH;
      const sc = Math.max(fw / pw, fh / ph);
      const cx = (b[0] + b[2]) / 2 * PW * sc, cy = (b[1] + b[3]) / 2 * PH * sc;
      const pv = $("pv");
      pv.style.backgroundImage = `url(/image/${S.pages[S.cur].page})`;
      pv.style.backgroundSize = `${PW * sc}px auto`;
      pv.style.backgroundPosition = `${fw / 2 - cx}px ${fh / 2 - cy}px`;
    }
    status(`预览中 · 格 ${k + 1} · 持续 ${dispWidth(k).toFixed(2)}s`);
  }
  PV.raf = requestAnimationFrame(pvTick);
}

let dragRef = null;
function startDrag(e, ref) {
  dragRef = ref;
  const tip = $("tip");
  const move = ev => {
    const W = $("right").clientWidth;
    const T = Math.max(total(), 1);
    let v = Math.max(0, Math.min(ev.clientX - $("right").getBoundingClientRect().left, W)) / W * T;
    if (ref.type === "cut") {
      const k = ref.k;
      const lo = k > 0 ? S.cuts[k - 1] + 0.3 : 0.3;
      const hi = k < n() - 2 ? S.cuts[k + 1] - 0.3 : S.blockDur - 0.3;
      S.cuts[k] = Math.max(lo, Math.min(hi, v));
    } else if (ref.type === "gap") {
      const k = ref.k;
      S.gaps[k] = Math.max(0, Math.min(6, v - (dispStart(k) + spk(k))));
    } else {
      S.endPad = Math.max(0, Math.min(6, v - (dispStart(ref.k) + spk(ref.k))));
    }
    const k = ref.k;
    tip.style.display = "block";
    tip.style.left = (ev.clientX + 14) + "px";
    tip.style.top = (ev.clientY - 10) + "px";
    tip.textContent = `该图片持续 ${dispWidth(k).toFixed(2)}s`;
    draw();
  };
  const up = () => {
    tip.style.display = "none";
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
}
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (!S.hdl) return;
  const step = e.shiftKey ? 0.1 : 0.02;
  const t = S.hdl.startsWith("cut") ? "cut" : S.hdl.startsWith("gap") ? "gap" : "end";
  const k = +S.hdl.replace(/^(cut|gap|end)/, "") || (t === "end" ? n() - 1 : 0);
  if (t === "cut") {
    const lo = k > 0 ? S.cuts[k - 1] + 0.3 : 0.3;
    const hi = k < n() - 2 ? S.cuts[k + 1] - 0.3 : S.blockDur - 0.3;
    if (e.key === "ArrowLeft") S.cuts[k] = Math.max(lo, S.cuts[k] - step);
    if (e.key === "ArrowRight") S.cuts[k] = Math.min(hi, S.cuts[k] + step);
  } else if (t === "gap") {
    if (e.key === "ArrowLeft") S.gaps[k] = Math.max(0, S.gaps[k] - step);
    if (e.key === "ArrowRight") S.gaps[k] = Math.min(6, S.gaps[k] + step);
  } else {
    if (e.key === "ArrowLeft") S.endPad = Math.max(0, S.endPad - step);
    if (e.key === "ArrowRight") S.endPad = Math.min(6, S.endPad + step);
  }
  e.preventDefault(); draw();
});

function bufToWav(f32, sr) {
  const m = f32.length;
  const buf = new ArrayBuffer(44 + m * 2);
  const v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, "RIFF"); v.setUint32(4, 36 + m * 2, true); ws(8, "WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true);
  v.setUint16(34, 16, true); ws(36, "data"); v.setUint32(40, m * 2, true);
  for (let i = 0; i < m; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 32768 : s * 32767, true);
  }
  return buf;
}
async function savePage() {
  const p = S.pages[S.cur];
  const cAll = [0, ...S.cuts, S.blockDur];
  for (let k = 0; k < n(); k++) {
    const bl = S.blocks[k];
    const a = Math.round(cAll[k] * S.sr), b = Math.round(cAll[k + 1] * S.sr);
    const gN = Math.round(gap(k) * S.sr);
    const pcm = new Float32Array((b - a) + gN);
    pcm.set(S.block.slice(a, b), 0);
    const wav = bufToWav(pcm, S.sr);
    let b64 = ""; const bytes = new Uint8Array(wav);
    for (let i = 0; i < bytes.length; i += 0x8000)
      b64 += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    const r = await api("/api/save_audio", JSON.stringify({
      audio: bl.shot.audio, wav_b64: btoa(b64), pad_zero: true
    }));
    if (!r.ok) { status("保存失败: " + bl.shot.id); return; }
    status(`保存 ${k + 1}/${n()}`);
  }
  status(`✔ ${p.page} 已写回（含空隙与停留）——全部页面完成后运行 compile+render 重新出片`);
}
window.addEventListener("resize", () => { if (S.cur >= 0) draw(); });
init();
</script>
</body>
</html>
